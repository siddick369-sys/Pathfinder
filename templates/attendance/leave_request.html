{% extends "base.html" %}
{% block title %}Demande de congé — AMN{% endblock %}

{% block content %}
<div class="container py-4" style="max-width:600px;">
    <a href="{% url 'attendance:dashboard' %}" style="font-size:0.85rem;color:#6c757d;">← Retour aux présences</a>
    <h2 class="mt-2 mb-4">📋 Nouvelle demande de congé</h2>

    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">Type de congé</label>
                    <select name="leave_type" class="form-select" required>
                        {% for value, label in leave_types %}
                        <option value="{{ value }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-6">
                        <label class="form-label fw-semibold">Date de début</label>
                        <input type="date" name="start_date" class="form-control" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label fw-semibold">Date de fin</label>
                        <input type="date" name="end_date" class="form-control" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Motif</label>
                    <textarea name="reason" class="form-control" rows="4" placeholder="Décrivez le motif de votre absence..." required></textarea>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary flex-fill">✅ Soumettre la demande</button>
                    <a href="{% url 'attendance:my_leaves' %}" class="btn btn-outline-secondary">Annuler</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
